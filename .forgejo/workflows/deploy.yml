name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: comments-deploy

jobs:
  deploy:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig
        run: |
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' -O https://mirror.pierdol.ing/zig/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          printf '%s\n' '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig-x86_64-linux-0.16.0.tar.xz' | sha256sum --check --strict
          tar -xf zig-x86_64-linux-0.16.0.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Build
        run: zig build -Doptimize=ReleaseSmall

      - name: Install docker CLI
        run: apt-get update && apt-get install -y docker.io

      - name: Build and push image
        run: |
          docker build --pull --no-cache -t 10.69.0.17:5000/scclie/comments:main .
          docker push 10.69.0.17:5000/scclie/comments:main

      - name: Request digest-pinned production deployment
        run: |
          set -euo pipefail
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' 10.69.0.17:5000/scclie/comments:main | cut -d@ -f2)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > /publish/requests/comments.digest.tmp
          mv /publish/requests/comments.digest.tmp /publish/requests/comments.digest
